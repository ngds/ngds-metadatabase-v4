var schemaDefLoad = function() {

        //var src_schema = data;
        // Object Definitions

        var sdef = gSchemaObject.def;
        
        var xnt = JSON.parse(sdef);
         console.log(' type is ' + typeof(xnt) );
        if ( typeof(sdef) !== "undefined" ) {
           $("#sObjectList").empty();
           var defNode = 0;
           //sdef = JSON.parse[sde];
           for ( var k in xnt ) {
              var mr = xnt[k];
             
              if ( mr.node_name == "definitions") {
                defNode = mr.node_id;
                var defItem = $('<a id="sdef-' + mr.node_id + '" onclick="showSchemDef(this);"  >Main</a>')
                    .attr('target', '_blank')                 
                    .css("height", "20px" )
                    .css("padding","4px 4px")
                    .css("margin", "10px")
                    .css("color", "#000044")
                    .css("font-size", "16px");
             
                  $("#sObjectList").append(defItem);
                  $("#sObjectList").append('</br>');
              }

              if ( defNode > 0 && defNode == mr.parent_id) {
                  var defItem = $('<a id="sdef-' + mr.node_id + '" onclick="showSchemDef(this);"  >' + mr.node_name + '</a>')
                    .attr('target', '_blank')                 
                    .css("height", "20px" )
                    .css("padding","4px 4px")
                    .css("margin", "10px")
                    .css("color", "#000044")
                    .css("font-size", "14px");
             
                  $("#sObjectList").append(defItem);
                  $("#sObjectList").append('</br>');

              }
          }
        }

        // Mapped elements
        var mpstr = gSchemaObject.map;
        var mapElem = JSON.parse(mpstr);


        // Schema

        var scStr = gSchemaObject.schema;
        var scObj = JSON.parse(scStr);        

        visualize(scObj);


      //$("#cb").html(JSON.stringify(gSchemaObject));

}

var schem_src = function() {
  var v = $("#ed");
  var inx = $("#pack_text").val();
   try {
      var ned = JSON.parse(inx);
      var treeData = schemaBuild( ned );
      gUI_Schema = treeData;
      //console.log( JSON.stringify(treeData[0]) );
      //$("#cb").html("JSON Build success - " + JSON.stringify(treeData) + '...' );   
      $("#cb").html("JSON Build success - " + JSON.stringify(treeData).substring(1,50) + '...' );   
       svgReady= true; 
       d3.selectAll("svg").remove();
       d3.selectAll('.d3-context-menu').remove();
       var error = {};
       visu(error, treeData);
      $("#cb").hide();
      $("#ed").hide();
   } catch(e) {
       console.log(e);
       $("#cb").html("JSONS Parsing Error " +  e );   
   }
  

}

var fedsmap = function() {

 var fsql = '/getData?tbn=vocabulary_record&qfld=vc_id&qv=1';

  $.ajax({
      type: 'GET',
      url: fsql,
      dataType: "json",
      contentType: "application/json",
      success: function(data) {
        gFedScMap = data.data;
        //$("#cb").html(JSON.stringify(data));
        for ( var k in gFedScMap ) {
              var mr = gFedScMap[k];
             
              if ( mr.status == "active") {
                defNode = mr.node_id;
                var defItem = $('<a id="fs-' + mr.record_id + '" onclick="showFedItem(this);"  >' + mr.value + '</a>')
                    .attr('target', '_blank')                 
                    .css("height", "20px" )
                    .css("padding","4px 4px")
                    .css("margin", "10px")
                    .css("color", "#000044")
                    .css("font-size", "14px");
             
                  $("#sMapList").append(defItem);
                  $("#sMapList").append('</br>');
              }   
          }
      }
    });
}
